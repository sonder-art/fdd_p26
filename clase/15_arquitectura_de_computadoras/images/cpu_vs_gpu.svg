<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="cvg-title cvg-desc" preserveAspectRatio="xMidYMid meet">
  <title id="cvg-title">CPU versus GPU</title>
  <desc id="cvg-desc">Una CPU tiene pocos núcleos flexibles optimizados para decisiones y baja latencia. Una GPU tiene muchas unidades paralelas optimizadas para aplicar la misma operación a muchos datos.</desc>
  <defs><linearGradient id="cvg-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient></defs>
  <style>.head{font:700 31px system-ui,sans-serif;fill:#fff;text-anchor:middle}.title{font:800 35px system-ui,sans-serif;fill:#fff;text-anchor:middle}.label{font:600 24px system-ui,sans-serif;fill:#e2e8f0;text-anchor:middle}.core{stroke-width:4}</style>
  <rect width="960" height="620" rx="36" fill="url(#cvg-bg)"/>
  <text x="480" y="54" class="head">CPU vs GPU: distinto patrón, distinto procesador</text>
  <rect x="48" y="92" width="400" height="452" rx="32" fill="#082f49" stroke="#22d3ee" stroke-width="4"/>
  <text x="248" y="144" class="title">CPU</text>
  <g>
    <rect x="100" y="184" width="128" height="128" rx="24" fill="#0e7490" stroke="#a5f3fc" class="core"/>
    <path d="M126 216h76M126 244h48M126 272h68" stroke="#cffafe" stroke-width="9" stroke-linecap="round"/>
    <rect x="268" y="184" width="128" height="128" rx="24" fill="#0e7490" stroke="#a5f3fc" class="core"/>
    <path d="M294 216h76M294 244h48M294 272h68" stroke="#cffafe" stroke-width="9" stroke-linecap="round"/>
  </g>
  <text x="248" y="364" class="label">Pocos núcleos complejos</text>
  <text x="248" y="404" class="label">rutas distintas · decisiones</text>
  <path d="M112 454h68l30-24 40 48 38-28 44 10 42-32" fill="none" stroke="#fbbf24" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="248" y="512" class="label">Prioriza latencia y flexibilidad</text>
  <rect x="512" y="92" width="400" height="452" rx="32" fill="#3b0764" stroke="#d8b4fe" stroke-width="4"/>
  <text x="712" y="144" class="title">GPU</text>
  <g fill="#a855f7" stroke="#f3e8ff" stroke-width="2">
    <rect x="558" y="184" width="42" height="42" rx="8"/><rect x="614" y="184" width="42" height="42" rx="8"/><rect x="670" y="184" width="42" height="42" rx="8"/><rect x="726" y="184" width="42" height="42" rx="8"/><rect x="782" y="184" width="42" height="42" rx="8"/><rect x="838" y="184" width="42" height="42" rx="8"/>
    <rect x="558" y="240" width="42" height="42" rx="8"/><rect x="614" y="240" width="42" height="42" rx="8"/><rect x="670" y="240" width="42" height="42" rx="8"/><rect x="726" y="240" width="42" height="42" rx="8"/><rect x="782" y="240" width="42" height="42" rx="8"/><rect x="838" y="240" width="42" height="42" rx="8"/>
    <rect x="558" y="296" width="42" height="42" rx="8"/><rect x="614" y="296" width="42" height="42" rx="8"/><rect x="670" y="296" width="42" height="42" rx="8"/><rect x="726" y="296" width="42" height="42" rx="8"/><rect x="782" y="296" width="42" height="42" rx="8"/><rect x="838" y="296" width="42" height="42" rx="8"/>
  </g>
  <text x="712" y="382" class="label">Muchas unidades simples</text>
  <text x="712" y="422" class="label">misma operación · muchos datos</text>
  <g stroke="#fbbf24" stroke-width="7"><path d="M566 468h292"/><path d="M566 448v40M622 448v40M678 448v40M734 448v40M790 448v40M846 448v40"/></g>
  <text x="712" y="512" class="label">Prioriza throughput paralelo</text>
  <text x="480" y="592" class="head">El problema elige el procesador</text>
</svg>
