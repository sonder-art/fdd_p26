<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="scale-title scale-desc" preserveAspectRatio="xMidYMid meet">
  <title id="scale-title">Escalar hardware empieza por identificar el cuello de botella</title>
  <desc id="scale-desc">Una decisión avanza desde un chip a servidor, rack, cluster y centro de datos sólo cuando capacidad, cómputo o comunicación lo exigen; cada salto agrega costo y coordinación.</desc>
  <defs>
    <linearGradient id="scale-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#082f49"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient>
    <marker id="scale-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#67e8f9"/></marker>
  </defs>
  <style>.head{font:700 31px system-ui,sans-serif;fill:#fff;text-anchor:middle}.label{font:700 24px system-ui,sans-serif;fill:#fff;text-anchor:middle}.small{font:500 21px system-ui,sans-serif;fill:#dbeafe;text-anchor:middle}.step{stroke-width:3}.flow{fill:none;stroke:#67e8f9;stroke-width:6;marker-end:url(#scale-arrow)}</style>
  <rect width="960" height="620" rx="36" fill="url(#scale-bg)"/>
  <text x="480" y="52" class="head">Escala sólo cuando el cuello de botella lo pide</text>
  <rect x="54" y="98" width="852" height="92" rx="28" fill="#111827" stroke="#fbbf24" stroke-width="3"/>
  <text x="480" y="138" class="label">Primero pregunta: ¿falta latencia, memoria, cómputo o comunicación?</text>
  <text x="480" y="170" class="small">medir → elegir recurso → volver a medir</text>
  <path d="M480 190V244" class="flow"/>
  <g>
    <rect x="42" y="250" width="150" height="154" rx="24" fill="#0e7490" stroke="#a5f3fc" class="step"/>
    <rect x="75" y="278" width="84" height="62" rx="10" fill="#67e8f9"/><path d="M92 291h50M92 307h50M92 323h50" stroke="#164e63" stroke-width="6"/>
    <text x="117" y="374" class="label">Chip</text>
    <rect x="224" y="250" width="150" height="154" rx="24" fill="#3730a3" stroke="#c7d2fe" class="step"/>
    <path d="M266 278h66v70h-66zM278 292h42M278 308h42M278 324h42" fill="none" stroke="#e0e7ff" stroke-width="7"/>
    <text x="299" y="374" class="label">Servidor</text>
    <rect x="406" y="250" width="150" height="154" rx="24" fill="#6d28d9" stroke="#e9d5ff" class="step"/>
    <path d="M446 274h70v78h-70zM456 287h50M456 306h50M456 325h50" fill="none" stroke="#f3e8ff" stroke-width="7"/>
    <text x="481" y="374" class="label">Rack</text>
    <rect x="588" y="250" width="150" height="154" rx="24" fill="#9f1239" stroke="#fecdd3" class="step"/>
    <g fill="#fda4af"><circle cx="630" cy="298" r="15"/><circle cx="664" cy="328" r="15"/><circle cx="699" cy="298" r="15"/></g><path d="M630 298 664 328 699 298" stroke="#ffe4e6" stroke-width="5"/>
    <text x="663" y="374" class="label">Cluster</text>
    <rect x="770" y="250" width="150" height="154" rx="24" fill="#b45309" stroke="#fde68a" class="step"/>
    <path d="M802 347v-62h86v62M818 347v-42h20v42M850 347v-42h20v42" fill="none" stroke="#fef3c7" stroke-width="7"/>
    <text x="845" y="374" class="label">Datacenter</text>
  </g>
  <path d="M192 327H224M374 327H406M556 327H588M738 327H770" class="flow"/>
  <g class="small"><text x="208" y="438">más capacidad</text><text x="390" y="470">más red</text><text x="572" y="438">más coordinación</text><text x="754" y="470">más energía</text></g>
  <path d="M118 514H844" stroke="#fbbf24" stroke-width="7" stroke-linecap="round"/>
  <path d="M142 492 118 514l24 22M820 492l24 22-24 22" fill="none" stroke="#fbbf24" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="480" y="558" class="label">Cada salto compra escala y cobra complejidad</text>
  <text x="480" y="592" class="small">La unidad de decisión es el workload, no el producto.</text>
</svg>
