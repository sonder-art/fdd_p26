<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="isa-title isa-desc" preserveAspectRatio="xMidYMid meet">
  <title id="isa-title">La ISA conecta el programa con ciclos del procesador</title>
  <desc id="isa-desc">El código se compila a instrucciones de una ISA. La CPU busca, decodifica, ejecuta y retira cada instrucción a lo largo de varios ciclos.</desc>
  <defs>
    <linearGradient id="isa-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <marker id="isa-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#67e8f9"/></marker>
  </defs>
  <style>
    .head{font:700 31px system-ui,sans-serif;fill:#f8fafc;text-anchor:middle}.label{font:700 27px system-ui,sans-serif;fill:#fff;text-anchor:middle}.small{font:500 22px system-ui,sans-serif;fill:#dbeafe;text-anchor:middle}.box{stroke-width:3}.arrow{fill:none;stroke:#67e8f9;stroke-width:6;marker-end:url(#isa-arrow)}
  </style>
  <rect width="960" height="620" rx="36" fill="url(#isa-bg)"/>
  <text x="480" y="54" class="head">La ISA es el contrato; el trabajo ocurre en ciclos</text>
  <rect x="54" y="108" width="190" height="100" rx="22" fill="#164e63" stroke="#67e8f9" class="box"/>
  <text x="149" y="151" class="label">Código</text><text x="149" y="183" class="small">Python · C · Rust</text>
  <path class="arrow" d="M244 158H348"/>
  <text x="296" y="142" class="small">compila</text>
  <rect x="348" y="92" width="264" height="132" rx="24" fill="#6d28d9" stroke="#d8b4fe" class="box"/>
  <text x="480" y="146" class="label">ISA</text>
  <text x="480" y="181" class="small">instrucciones + registros</text>
  <path class="arrow" d="M612 158H716"/>
  <rect x="716" y="108" width="190" height="100" rx="22" fill="#7c2d12" stroke="#fdba74" class="box"/>
  <text x="811" y="151" class="label">CPU</text><text x="811" y="183" class="small">implementa la ISA</text>
  <path d="M480 224V282" class="arrow"/>
  <text x="480" y="273" class="small">una instrucción atraviesa etapas</text>
  <line x1="92" y1="514" x2="868" y2="514" stroke="#94a3b8" stroke-width="4"/>
  <g>
    <rect x="76" y="322" width="184" height="138" rx="24" fill="#0e7490" stroke="#a5f3fc" class="box"/>
    <text x="168" y="380" class="label">1 · Buscar</text><text x="168" y="418" class="small">lee instrucción</text>
    <rect x="284" y="322" width="184" height="138" rx="24" fill="#4338ca" stroke="#c7d2fe" class="box"/>
    <text x="376" y="380" class="label">2 · Decodificar</text><text x="376" y="418" class="small">entiende bits</text>
    <rect x="492" y="322" width="184" height="138" rx="24" fill="#7e22ce" stroke="#e9d5ff" class="box"/>
    <text x="584" y="380" class="label">3 · Ejecutar</text><text x="584" y="418" class="small">opera / accede</text>
    <rect x="700" y="322" width="184" height="138" rx="24" fill="#b45309" stroke="#fde68a" class="box"/>
    <text x="792" y="380" class="label">4 · Retirar</text><text x="792" y="418" class="small">confirma resultado</text>
  </g>
  <g fill="#67e8f9">
    <circle cx="168" cy="514" r="10"/><circle cx="376" cy="514" r="10"/><circle cx="584" cy="514" r="10"/><circle cx="792" cy="514" r="10"/>
  </g>
  <text x="168" y="558" class="small">ciclo 1</text><text x="376" y="558" class="small">ciclo 2</text><text x="584" y="558" class="small">ciclo 3</text><text x="792" y="558" class="small">ciclo 4</text>
  <text x="480" y="598" class="small">Pipeline: distintas instrucciones pueden ocupar etapas distintas al mismo tiempo.</text>
</svg>
