<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="mem-title mem-desc" preserveAspectRatio="xMidYMid meet">
  <title id="mem-title">Jerarquía de memoria y camino de los datos</title>
  <desc id="mem-desc">Los datos se acercan desde almacenamiento a RAM, caché y registros antes de ser calculados. Cerca del cómputo hay menor capacidad y mayor rapidez.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#064e3b"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#fbbf24"/></marker></defs>
  <style>.head{font:700 46px system-ui,sans-serif;fill:#fff;text-anchor:middle}.label{font:700 42px system-ui,sans-serif;fill:#fff;text-anchor:middle}.box{stroke-width:4}.arrow{fill:none;stroke:#fbbf24;stroke-width:7;marker-end:url(#a)}</style>
  <rect width="960" height="620" rx="36" fill="url(#bg)"/>
  <text x="480" y="62" class="head">Mover datos suele costar más</text>
  <rect x="350" y="110" width="260" height="86" rx="22" fill="#7c3aed" stroke="#ddd6fe" class="box"/><text x="480" y="166" class="label">Registros</text>
  <path d="M480 196V226" class="arrow"/><rect x="290" y="226" width="380" height="92" rx="24" fill="#0e7490" stroke="#a5f3fc" class="box"/><text x="480" y="286" class="label">Caché</text>
  <path d="M480 318V348" class="arrow"/><rect x="206" y="348" width="548" height="96" rx="24" fill="#0369a1" stroke="#bae6fd" class="box"/><text x="480" y="410" class="label">RAM / VRAM</text>
  <path d="M480 444V474" class="arrow"/><rect x="104" y="474" width="752" height="96" rx="24" fill="#9a3412" stroke="#fed7aa" class="box"/><text x="480" y="536" class="label">SSD / red</text>
</svg>
