<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="ai-title ai-desc" preserveAspectRatio="xMidYMid meet">
  <title id="ai-title">La memoria de IA es más que los pesos</title>
  <desc id="ai-desc">En inferencia se almacenan pesos, caché KV y temporales. En entrenamiento se suman gradientes, estados del optimizador y activaciones; el lote y el contexto amplían el uso.</desc>
  <defs><linearGradient id="ai-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#312e81"/></linearGradient></defs>
  <style>.head{font:700 31px system-ui,sans-serif;fill:#fff;text-anchor:middle}.title{font:800 32px system-ui,sans-serif;fill:#fff;text-anchor:middle}.label{font:700 24px system-ui,sans-serif;fill:#fff;text-anchor:middle}.small{font:500 21px system-ui,sans-serif;fill:#dbeafe;text-anchor:middle}.outline{stroke:#e2e8f0;stroke-width:4}</style>
  <rect width="960" height="620" rx="36" fill="url(#ai-bg)"/>
  <text x="480" y="52" class="head">¿Cabe el modelo? Pesos son sólo el piso</text>
  <text x="260" y="106" class="title">Inferencia</text><text x="700" y="106" class="title">Entrenamiento</text>
  <rect x="92" y="132" width="336" height="376" rx="30" fill="#111827" class="outline"/>
  <rect x="118" y="376" width="284" height="106" rx="14" fill="#7c3aed"/>
  <text x="260" y="424" class="label">Pesos</text><text x="260" y="456" class="small">parámetros × bits / 8</text>
  <rect x="118" y="272" width="284" height="88" rx="14" fill="#0369a1"/>
  <text x="260" y="311" class="label">Caché KV</text><text x="260" y="340" class="small">contexto × lote</text>
  <rect x="118" y="158" width="284" height="98" rx="14" fill="#0f766e"/>
  <text x="260" y="203" class="label">Activaciones + temporales</text><text x="260" y="233" class="small">depende de ejecución</text>
  <rect x="532" y="132" width="336" height="376" rx="30" fill="#111827" class="outline"/>
  <rect x="558" y="406" width="284" height="76" rx="14" fill="#7c3aed"/>
  <text x="700" y="454" class="label">Pesos</text>
  <rect x="558" y="322" width="284" height="68" rx="14" fill="#be123c"/>
  <text x="700" y="365" class="label">Gradientes</text>
  <rect x="558" y="222" width="284" height="84" rx="14" fill="#b45309"/>
  <text x="700" y="258" class="label">Optimizador</text><text x="700" y="286" class="small">estados adicionales</text>
  <rect x="558" y="158" width="284" height="48" rx="14" fill="#0f766e"/>
  <text x="700" y="190" class="label">Activaciones</text>
  <path d="M454 160V492" stroke="#fbbf24" stroke-width="6" stroke-dasharray="12 12"/>
  <text x="480" y="548" class="head">Contexto, lote y precisión mueven la frontera</text>
  <text x="480" y="584" class="small">Cuantizar reduce pesos; no elimina el resto de la memoria.</text>
</svg>
