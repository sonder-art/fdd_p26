<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="roof-title roof-desc" preserveAspectRatio="xMidYMid meet">
  <title id="roof-title">Roofline simplificado</title>
  <desc id="roof-desc">Con poca intensidad operacional, el rendimiento está limitado por el ancho de banda de memoria. Con suficiente reutilización de datos, alcanza el techo de cómputo.</desc>
  <defs>
    <linearGradient id="roof-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <marker id="roof-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#cbd5e1"/></marker>
  </defs>
  <style>.head{font:700 31px system-ui,sans-serif;fill:#fff;text-anchor:middle}.label{font:700 25px system-ui,sans-serif;fill:#fff}.small{font:500 22px system-ui,sans-serif;fill:#cbd5e1}.axis{stroke:#cbd5e1;stroke-width:4;marker-end:url(#roof-arrow)}.grid{stroke:#334155;stroke-width:2;stroke-dasharray:8 10}</style>
  <rect width="960" height="620" rx="36" fill="url(#roof-bg)"/>
  <text x="480" y="52" class="head">Roofline-lite: reutilizar datos cambia el límite</text>
  <g class="grid"><path d="M140 164H870M140 264H870M140 364H870M300 94V516M500 94V516M700 94V516"/></g>
  <path d="M140 516V94" class="axis"/><path d="M140 516H884" class="axis"/>
  <text x="510" y="588" class="label" text-anchor="middle">Intensidad operacional → más operaciones por byte</text>
  <text x="44" y="315" class="label" text-anchor="middle" transform="rotate(-90 44 315)">Rendimiento observado</text>
  <path d="M150 486 550 154H862" fill="none" stroke="#fbbf24" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M172 466 470 218" fill="none" stroke="#67e8f9" stroke-width="4" stroke-dasharray="10 10"/>
  <text x="254" y="390" class="label" fill="#67e8f9" transform="rotate(-40 254 390)">límite: memoria</text>
  <text x="672" y="136" class="label" fill="#fde68a">techo de cómputo</text>
  <circle cx="326" cy="340" r="15" fill="#22d3ee" stroke="#cffafe" stroke-width="5"/>
  <text x="342" y="318" class="small">poca reutilización</text>
  <circle cx="696" cy="154" r="15" fill="#f97316" stroke="#ffedd5" stroke-width="5"/>
  <text x="712" y="208" class="small">mucho trabajo</text><text x="712" y="236" class="small">por dato</text>
  <rect x="176" y="536" width="608" height="38" rx="19" fill="#1e293b"/>
  <text x="480" y="563" class="small" text-anchor="middle">Más FLOPS no ayudan si los datos no llegan a tiempo.</text>
</svg>
